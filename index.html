<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Задание 4 – AR на Three.js (hit-test)</title>
  <style>
    body {
      margin: 0;
    }
    #start {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 28px;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <button id="start">Начать AR</button>

  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js" } }
  </script>

  <script type="module">
    import * as THREE from 'three';

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);
    scene.add(new THREE.HemisphereLight(0xffffff, 0xbbbbff, 3));

    // Маркер – кольцо, которое показывает, куда встанет куб
    const reticle = new THREE.Mesh(
      new THREE.RingGeometry(0.15, 0.2, 32).rotateX(-Math.PI / 2),
      new THREE.MeshBasicMaterial()
    );
    reticle.matrixAutoUpdate = false;
    reticle.visible = false;
    scene.add(reticle);

    // Куб 20 см, основание на поверхности
    const geometry = new THREE.BoxGeometry(0.2, 0.2, 0.2).translate(0, 0.1, 0);
    const material = new THREE.MeshStandardMaterial({ color: 0x4f8ef7 });

    let hitTestSource = null;

    document.getElementById('start').addEventListener('click', async () => {
      const session = await navigator.xr.requestSession('immersive-ar', {
        requiredFeatures: ['hit-test', 'local-floor'],
      });
      renderer.xr.setReferenceSpaceType('local-floor');
      await renderer.xr.setSession(session);

      // Луч hit-test идёт из центра экрана
      const viewerSpace = await session.requestReferenceSpace('viewer');
      hitTestSource = await session.requestHitTestSource({ space: viewerSpace });

      // Тап по экрану – ставим куб туда, где сейчас маркер.
      // Куб добавляется в сцену, а не к камере, поэтому остаётся на месте.
      session.addEventListener('select', () => {
        if (!reticle.visible) return;
        const cube = new THREE.Mesh(geometry, material);
        reticle.matrix.decompose(cube.position, cube.quaternion, cube.scale);
        scene.add(cube);
      });
    });

    renderer.setAnimationLoop((time, frame) => {
      if (frame && hitTestSource) {
        const results = frame.getHitTestResults(hitTestSource);
        if (results.length > 0) {
          const pose = results[0].getPose(renderer.xr.getReferenceSpace());
          reticle.matrix.fromArray(pose.transform.matrix);
          reticle.visible = true;
        } else {
          reticle.visible = false;
        }
      }
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
